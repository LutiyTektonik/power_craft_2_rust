[mod]
id = "powercraft2"
version = "0.1.0"
priority = 100

[compatibility]
horizon_revision = "f4d8d62c31ec2b08046faded7bef1b476783f319"

[[module]]
id = "transport"
file = "crates/horizon-client/src/game.rs"
name = "powercraft2_transport"
source = "transport.rs"

[[injection]]
id = "listen_to_entity_ticks"
hook = "entity_tick_listened"
hook_version = 1
kind = "HEAD"
helper = "listen.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "listened", ty = "&mut bool", value = "&mut *listened" },
]

[[injection]]
id = "conveyor_item_tick"
hook = "entity_tick_post"
hook_version = 1
kind = "HEAD"
helper = "item_tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "dimension", ty = "&str", value = "dimension" },
  { name = "entity", ty = "u32", value = "entity" },
  { name = "kind", ty = "&str", value = "kind" },
]

[[injection]]
id = "conveyor_placement"
hook = "state_for_placement"
hook_version = 1
kind = "HEAD"
helper = "placement.rs"
bindings = [
  { name = "level", ty = "&crate::game::GameLevel<'_>", value = "self" },
  { name = "state", ty = "horizon_world::registry::BlockStateId", value = "state" },
  { name = "context", ty = "&horizon_world::level::PlacementContext", value = "context" },
  { name = "answer", ty = "&mut Option<Option<horizon_world::registry::BlockStateId>>", value = "&mut *answer" },
]
